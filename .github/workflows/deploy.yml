name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows:
      - Validate Public Data
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  HUSKY: 0

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  freshness:
    name: Resolve Current Main Commit
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    outputs:
      current: ${{ steps.deployment-ref.outputs.current }}
      ref: ${{ steps.deployment-ref.outputs.ref }}

    steps:
      - name: Resolve immutable deployment commit
        id: deployment-ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: >-
            ${{ github.event_name == 'workflow_run'
                && github.event.workflow_run.head_sha
                || '' }}
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')"

          if [[ -n "$VALIDATED_SHA" && "$VALIDATED_SHA" != "$current_sha" ]]; then
            echo "Validated commit $VALIDATED_SHA is no longer current main ($current_sha)."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "ref=${VALIDATED_SHA:-$current_sha}" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate Public Data
    runs-on: ubuntu-latest
    needs: freshness
    if: needs.freshness.outputs.current == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.freshness.outputs.ref }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/bunfig.toml" <<'EOF'
          [install.scopes]
          "@csc3213-2026-group-b" = { token = "$NODE_AUTH_TOKEN", url = "https://npm.pkg.github.com/" }
          EOF
          bun --config="$RUNNER_TEMP/bunfig.toml" install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Check generated projections
        run: bun run generate:check

      - name: Validate people data
        run: bun run validate:people

      - name: Validate academic data
        run: bun run validate:academic

      - name: Validate projects data
        run: bun run validate:projects

      - name: Check formatting
        run: bun run format:check

      - name: Build worker
        run: bunx wrangler build

  deploy:
    name: >-
      ${{ github.event_name == 'workflow_dispatch'
          && 'Manual Deployment'
          || 'Verified Main Deployment' }}

    runs-on: ubuntu-latest
    needs: [freshness, validate]
    if: >-
      needs.freshness.outputs.current == 'true' &&
      needs.validate.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.freshness.outputs.ref }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/bunfig.toml" <<'EOF'
          [install.scopes]
          "@csc3213-2026-group-b" = { token = "$NODE_AUTH_TOKEN", url = "https://npm.pkg.github.com/" }
          EOF
          bun --config="$RUNNER_TEMP/bunfig.toml" install --frozen-lockfile --ignore-scripts

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
