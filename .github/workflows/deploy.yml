name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows:
      - Validate Public Data
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  HUSKY: 0
  DEPLOY_REF: >-
    ${{ github.event_name == 'workflow_run'
        && github.event.workflow_run.head_sha
        || 'main' }}

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Public Data
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/bunfig.toml" <<'EOF'
          [install.scopes]
          "@csc3213-2026-group-b" = { token = "$NODE_AUTH_TOKEN", url = "https://npm.pkg.github.com/" }
          EOF
          bun --config="$RUNNER_TEMP/bunfig.toml" install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Check generated projections
        run: bun run generate:check

      - name: Validate people data
        run: bun run validate:people

      - name: Validate academic data
        run: bun run validate:academic

      - name: Validate projects data
        run: bun run validate:projects

      - name: Check formatting
        run: bun run format:check

      - name: Build worker
        run: bunx wrangler build

  deploy:
    name: >-
      ${{ github.event_name == 'workflow_dispatch'
          && 'Manual Deployment'
          || 'Verified Main Deployment' }}

    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/bunfig.toml" <<'EOF'
          [install.scopes]
          "@csc3213-2026-group-b" = { token = "$NODE_AUTH_TOKEN", url = "https://npm.pkg.github.com/" }
          EOF
          bun --config="$RUNNER_TEMP/bunfig.toml" install --frozen-lockfile --ignore-scripts

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
