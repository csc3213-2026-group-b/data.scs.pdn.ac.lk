name: Validate Public Data

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/publish-public-projections.yml'
      - '.github/workflows/auto-merge-profile-pr.yml'
      - '.github/workflows/validate-public-data.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'wrangler.jsonc'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

permissions:
  contents: read

jobs:
  validate-public-data:
    name: Validate Public Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Check generated projections
        run: bun run generate:check

      - name: Validate people data
        run: bun run validate:people

      - name: Validate academic data
        run: bun run validate:academic

      - name: Validate projects data
        run: bun run validate:projects

      - name: Check formatting
        run: bun run format:check

      - name: Build worker
        run: bunx wrangler build
