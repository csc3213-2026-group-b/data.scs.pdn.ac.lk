name: Validate Public Data

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'wrangler.jsonc'

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
        github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

permissions:
  contents: read
  packages: read

jobs:
  validate-public-data:
    name: Validate Public Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/bunfig.toml" <<'EOF'
          [install.scopes]
          "@csc3213-2026-group-b" = { token = "$NODE_AUTH_TOKEN", url = "https://npm.pkg.github.com/" }
          EOF
          bun --config="$RUNNER_TEMP/bunfig.toml" install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Check generated projections
        run: bun run generate:check

      - name: Validate people data
        run: bun run validate:people

      - name: Validate academic data
        run: bun run validate:academic

      - name: Validate projects data
        run: bun run validate:projects

      - name: Check formatting
        run: bun run format:check

      - name: Build worker
        run: bunx wrangler build
