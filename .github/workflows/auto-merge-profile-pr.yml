name: Auto Merge Public Data PR

on:
  pull_request_target:
    types:
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: startsWith(github.event.label.name, 'auto-merge-')
    runs-on: ubuntu-latest

    steps:
      - name: Check automatic merge eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json author,state,isDraft,headRefName,headRefOid,headRepository,labels)"

          author="$(jq -r '.author.login' <<< "$pr_json")"
          state="$(jq -r '.state' <<< "$pr_json")"
          is_draft="$(jq -r '.isDraft' <<< "$pr_json")"
          head_ref="$(jq -r '.headRefName' <<< "$pr_json")"
          head_sha="$(jq -r '.headRefOid' <<< "$pr_json")"
          head_repo="$(jq -r '.headRepository.nameWithOwner' <<< "$pr_json")"

          has_label() {
            jq -e --arg label "$1" \
              'any(.labels[].name; . == $label)' \
              <<< "$pr_json" >/dev/null
          }

          if [[ "$author" != "app/scs-portal-github-app" ]]; then
            echo "PR #$PR_NUMBER was not opened by the trusted GitHub App."
            exit 0
          fi

          if [[ "$state" != "OPEN" || "$is_draft" == "true" ]]; then
            echo "PR #$PR_NUMBER is not an open, ready pull request."
            exit 0
          fi

          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #$PR_NUMBER is from another repository."
            exit 0
          fi

          eligible=false

          if [[ "$head_ref" == profile/* ]] &&
             has_label "profile-update" &&
             has_label "auto-merge-profile"; then
            eligible=true
          fi

          if [[ "$head_ref" == project/* ]] &&
             has_label "project-update" &&
             has_label "auto-merge-project"; then
            eligible=true
          fi

          if [[ "$head_ref" == project-delete/* ]] &&
             has_label "project-delete" &&
             has_label "auto-merge-project"; then
            eligible=true
          fi

          if [[ "$head_ref" == course/* ]] &&
             has_label "course-update" &&
             has_label "auto-merge-course"; then
            eligible=true
          fi

          if [[ "$head_ref" == course-delete/* ]] &&
             has_label "course-delete" &&
             has_label "auto-merge-course"; then
            eligible=true
          fi

          if [[ "$head_ref" == course-offering/* ]] &&
             has_label "course-offering-update" &&
             has_label "auto-merge-course"; then
            eligible=true
          fi

          if [[ "$head_ref" == course-offering-delete/* ]] &&
             has_label "course-offering-delete" &&
             has_label "auto-merge-course"; then
            eligible=true
          fi

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Create scoped GitHub App token
        if: steps.eligibility.outputs.eligible == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SCS_PORTAL_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCS_PORTAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update stale branch
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.eligibility.outputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          merge_state=unknown
          for attempt in {1..5}; do
            merge_state="$(gh api \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.mergeable_state')"
            if [[ "$merge_state" != "unknown" ]]; then
              break
            fi
            sleep 1
          done

          case "$merge_state" in
            behind)
              gh api --method PUT \
                "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/update-branch" \
                -f expected_head_sha="$HEAD_SHA"
              ;;
            dirty)
              echo "PR #$PR_NUMBER has merge conflicts."
              exit 1
              ;;
            unknown)
              echo "GitHub did not resolve the merge state for PR #$PR_NUMBER."
              exit 1
              ;;
            *)
              echo "PR #$PR_NUMBER does not need a branch update ($merge_state)."
              ;;
          esac

      - name: Enable auto-merge
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --auto \
            --delete-branch
