name: Auto Merge Public Data PR

on:
  pull_request_target:
    types:
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: startsWith(github.event.label.name, 'auto-merge-')
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge for eligible PR
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          pr_json="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,isDraft,headRefName,headRepository,labels)"

          state="$(jq -r '.state' <<< "$pr_json")"
          is_draft="$(jq -r '.isDraft' <<< "$pr_json")"
          head_ref="$(jq -r '.headRefName' <<< "$pr_json")"
          head_repo="$(jq -r '.headRepository.nameWithOwner' <<< "$pr_json")"

          has_label() {
            jq -e --arg label "$1" \
              'any(.labels[].name; . == $label)' \
              <<< "$pr_json" >/dev/null
          }

          if [[ "$state" != "OPEN" ]]; then
            echo "PR #$PR_NUMBER is not open; skipping."
            exit 0
          fi

          if [[ "$is_draft" == "true" ]]; then
            echo "PR #$PR_NUMBER is still a draft; skipping."
            exit 0
          fi

          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #$PR_NUMBER is from another repository; skipping."
            exit 0
          fi

          eligible=false

          if [[ "$head_ref" == profile/* ]] &&
             has_label "profile-update" &&
             has_label "auto-merge-profile"; then
            eligible=true
          fi

          if [[ "$head_ref" == project/* ]] &&
             has_label "project-update" &&
             has_label "auto-merge-project"; then
            eligible=true
          fi

          if [[ "$head_ref" == project-delete/* ]] &&
             has_label "project-delete" &&
             has_label "auto-merge-project"; then
            eligible=true
          fi

          if [[ "$head_ref" == course/* ]] &&
             has_label "course-update" &&
             has_label "auto-merge-course"; then
            eligible=true
          fi

          if [[ "$head_ref" == course-delete/* ]] &&
             has_label "course-delete" &&
             has_label "auto-merge-course"; then
            eligible=true
          fi

          if [[ "$head_ref" == course-offering/* ]] &&
             has_label "course-offering-update" &&
             has_label "auto-merge-course"; then
            eligible=true
          fi

          if [[ "$head_ref" == course-offering-delete/* ]] &&
             has_label "course-offering-delete" &&
             has_label "auto-merge-course"; then
            eligible=true
          fi

          if [[ "$eligible" != "true" ]]; then
            echo "PR #$PR_NUMBER is not eligible for automatic merging."
            exit 0
          fi

          echo "PR is eligible. Enabling auto-merge."

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --merge \
            --auto \
            --delete-branch
