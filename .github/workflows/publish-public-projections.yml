name: Publish Public Projections

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/people/v2/users/**'
      - 'public/people/v2/special/**'
      - 'public/projects/v2/projects/**'
      - 'public/academic/v2/courses/**'
      - 'public/academic/v2/offerings/**'
      - '.github/scripts/generate-public-projections.ts'

concurrency:
  group: public-projection-publication
  cancel-in-progress: false

env:
  HUSKY: 0

permissions:
  contents: read
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/bunfig.toml" <<'EOF'
          [install.scopes]
          "@csc3213-2026-group-b" = { token = "$NODE_AUTH_TOKEN", url = "https://npm.pkg.github.com/" }
          EOF
          bun install --frozen-lockfile --ignore-scripts \
            --config "$RUNNER_TEMP/bunfig.toml"

      - name: Generate projections
        run: bun run generate

      - name: Stop when projections are already current
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated publication
        if: steps.changes.outputs.changed == 'true'
        run: bun run check

      - name: Create scoped GitHub App token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SCS_PORTAL_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCS_PORTAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish projection pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: automation/public-projections
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "scs-portal-github-app[bot]"
          git config user.email \
            "258597335+scs-portal-github-app[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public
          git commit -m "chore(data): regenerate public projections"

          remote_sha="$(git ls-remote --heads origin "$BRANCH" | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push origin "HEAD:refs/heads/$BRANCH" \
              --force-with-lease="refs/heads/$BRANCH:$remote_sha"
          else
            git push --set-upstream origin "HEAD:refs/heads/$BRANCH"
          fi

          pr_number="$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(data): regenerate public projections" \
              --body "Deterministically regenerates public projections from the authoritative entity files."
            pr_number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi

          gh pr merge "$pr_number" --auto --merge --delete-branch
