name: Publish Public Projections

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/people/v2/users/**'
      - 'public/people/v2/special/**'
      - 'public/projects/v2/projects/**'
      - 'public/academic/v2/courses/**'
      - 'public/academic/v2/offerings/**'
      - '.github/scripts/generate-public-projections.ts'

concurrency:
  group: public-projection-publication
  cancel-in-progress: false

env:
  HUSKY: 0
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verified main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate projections
        run: bun run generate

      - name: Stop when projections are already current
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- public; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated publication
        if: steps.changes.outputs.changed == 'true'
        run: |
          bun run test
          bun run generate:check
          bun run validate:people
          bun run validate:academic
          bun run validate:projects
          bun run format:check
          bunx wrangler build

      - name: Publish projection pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: automation/public-projections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add public
          git commit -m "chore(data): regenerate public projections"
          git push --force origin "HEAD:$BRANCH"

          pr_number="$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(data): regenerate public projections" \
              --body "Deterministically regenerates public projections from the authoritative entity files."
            pr_number="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi

          gh pr merge "$pr_number" --auto --merge --delete-branch
