name: Update Public Projections

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: 0

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  update:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'scs-portal-github-app[bot]' &&
      (startsWith(github.event.pull_request.head.ref, 'profile/') ||
       startsWith(github.event.pull_request.head.ref, 'project/') ||
       startsWith(github.event.pull_request.head.ref, 'project-delete/') ||
       startsWith(github.event.pull_request.head.ref, 'course/') ||
       startsWith(github.event.pull_request.head.ref, 'course-delete/') ||
       startsWith(github.event.pull_request.head.ref, 'course-offering/') ||
       startsWith(github.event.pull_request.head.ref, 'course-offering-delete/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted generator
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install trusted dependencies
        working-directory: trusted
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/bunfig.toml" <<'EOF'
          [install.scopes]
          "@csc3213-2026-group-b" = { token = "$NODE_AUTH_TOKEN", url = "https://npm.pkg.github.com/" }
          EOF
          bun install --frozen-lockfile --ignore-scripts \
            --config "$RUNNER_TEMP/bunfig.toml"

      - name: Verify trusted pull request scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[].filename'
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "Pull request has no changed files."
            exit 1
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              public/people/v2/*|public/projects/v2/*|public/academic/v2/*)
                ;;
              *)
                echo "Refusing privileged update for unexpected path: $file"
                exit 1
                ;;
            esac
          done

      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SCS_PORTAL_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCS_PORTAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout candidate data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate projections with trusted code
        working-directory: candidate
        run: bun ../trusted/.github/scripts/generate-public-projections.ts

      - name: Commit current projections
        working-directory: candidate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          git add -A -- public/people/v2 public/projects/v2 public/academic/v2

          if git diff --cached --quiet; then
            echo "Generated projections are already current."
            exit 0
          fi

          current_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '.head.sha')"
          if [[ "$current_sha" != "$HEAD_SHA" ]]; then
            echo "Pull request head advanced from $HEAD_SHA to $current_sha."
            exit 1
          fi

          git config user.name "scs-portal-github-app[bot]"
          git config user.email \
            "258597335+scs-portal-github-app[bot]@users.noreply.github.com"
          git commit -m "chore(data): regenerate public projections"
          git push origin "HEAD:refs/heads/$HEAD_REF" \
            --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA"
